<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>New message — {{ app_name }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .wrapper { width: 100%; background-color: #f5f5f5; padding: 48px 16px; }
    .card    { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
    .header  { background-color: #2563eb; padding: 36px 48px; text-align: center; }
    .header h1 { margin: 0; color: #ffffff; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .body    { padding: 44px 48px; }
    .body h2 { margin: 0 0 12px; color: #18181b; font-size: 18px; font-weight: 600; }
    .body p  { margin: 0 0 20px; color: #52525b; font-size: 15px; line-height: 1.7; }
    .quote   { margin: 24px 0; padding: 16px 20px; background: #f8fafc; border-left: 3px solid #2563eb; border-radius: 4px; color: #3f3f46; font-size: 14px; line-height: 1.6; }
    .btn     { display: inline-block; margin: 8px 0 24px; padding: 12px 28px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: 600; }
    .footer  { padding: 28px 48px; text-align: center; }
    .footer p { margin: 0; color: #a1a1aa; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header"><h1>{{ app_name }}</h1></div>
      <div class="body">
        <h2>New message from {{ sender_name }}</h2>
        <p>Hi {{ full_name }}, you have a new message on {{ app_name }}.</p>
        <div class="quote">{{ preview }}</div>
        <a class="btn" href="{{ conversation_url }}">Open conversation</a>
        <p>Reply directly from your {{ app_name }} dashboard.</p>
      </div>
      <div class="footer">
        <p>© {{ year }} {{ app_name }}. All rights reserved.</p>
      </div>
    </div>
  </div>
</body>
</html>
